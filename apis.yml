aid: bobyard
name: Bobyard
description: >-
  Bobyard is an AI takeoff and estimating software company for the construction
  industry. Its platform reads construction drawings and blueprints to
  automatically extract quantities and organize takeoffs, cutting manual
  estimation work by 50-90% for trade contractors in landscaping, electrical,
  plumbing, mechanical, and finishes. Trained on millions of drawings, Bobyard
  automates AI takeoff, manual takeoff, OC conversions, and estimate generation
  so contractors can increase bid capacity without expanding estimating staff.
  Bobyard was surfaced as a portfolio company of 8vc and added to the API
  Evangelist network. It publishes product documentation and a live status page
  (including an Inference API component) but does not currently expose a public
  developer API, OpenAPI, or SDKs.
